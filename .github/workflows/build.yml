# ============================================================
# Build Armbian RK3399 (rockpro64) — 无名 RK3399 板自定义镜像
# 手动触发：仓库 Actions 页面 -> 左侧 Build Armbian RK3399 custom
#            -> 右侧 Run workflow -> Run
# 产物：Armbian_*.img.xz 在 run 页底部 Artifacts（zip）里
# 依赖：仓库根目录必须有 rk3399-custom.dtb（本仓库已放）
# ============================================================
name: Build Armbian RK3399 custom

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Armbian 板型'
        required: true
        default: rockpro64
      branch:
        description: '内核分支 (current/edge/vendor)'
        required: true
        default: current
      release:
        description: '发行版 (trixie/noble)'
        required: true
        default: trixie

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # 1. 检出你自己的仓库（含 rk3399-custom.dtb + 本 workflow）
      - name: Checkout this repo
        uses: actions/checkout@v4

      # 2. 检出 armbian/build 官方构建框架（约几百 MB，需几分钟）
      - name: Checkout armbian/build
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: build

      # 3. 编译 Armbian 镜像
      #    BUILD_MINIMAL=yes : 精简 rootfs，省时间省体积
      #    ROOTFS_SIZE=4096   : rootfs 分区 4GB，确保烧进 8G eMMC（首启自动扩展）
      #    KERNEL_BTF=no      : 去掉 BTF，显著降低内存占用和编译时长
      - name: Compile Armbian
        working-directory: build
        run: |
          sudo ./compile.sh \
            BOARD=${{ inputs.board }} \
            BRANCH=${{ inputs.branch }} \
            RELEASE=${{ inputs.release }} \
            BUILD_MINIMAL=yes \
            ROOTFS_SIZE=4096 \
            KERNEL_CONFIGURE=no \
            KERNEL_BTF=no \
            COMPRESS_OUTPUTIMAGE=img,xz

      # 4. 用你的改造版 DTB 替换镜像里的 rockpro64 DTB
      #    （文件名保持不变 rk3399-rockpro64.dtb，extlinux 的 FDT 指向不用改）
      - name: Replace DTB in image
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -1)
          echo "镜像: $IMG"
          LOOP=$(sudo losetup -f)
          sudo losetup -P $LOOP "$IMG"
          sleep 2
          sudo mkdir -p /mnt/arm
          sudo mount ${LOOP}p1 /mnt/arm
          echo "镜像内 DTB:"
          find /mnt/arm/boot -name 'rk3399-rockpro64.dtb' -print
          sudo find /mnt/arm/boot -name 'rk3399-rockpro64.dtb' \
            -exec cp rk3399-custom.dtb {} \;
          sudo umount /mnt/arm
          sudo losetup -d $LOOP
          echo "DTB 替换完成"

      # 5. 上传产物（zip，run 页面底部 Artifacts 下载）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3399-custom
          path: |
            build/output/images/*.img*
          retention-days: 7
