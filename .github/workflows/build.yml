name: Build Armbian RK3399 custom

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Armbian 板型'
        required: true
        default: rockpro64
      branch:
        description: '内核分支 (current/edge/vendor)'
        required: true
        default: current
      release:
        description: '发行版 (trixie/noble)'
        required: true
        default: trixie

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout armbian/build
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: build

      - name: Compile Armbian
        working-directory: build
        run: |
          sudo ./compile.sh \
            BOARD=${{ inputs.board }} \
            BRANCH=${{ inputs.branch }} \
            RELEASE=${{ inputs.release }} \
            BUILD_MINIMAL=yes \
            ROOTFS_SIZE=4096 \
            KERNEL_CONFIGURE=no \
            KERNEL_BTF=no \
            COMPRESS_OUTPUTIMAGE=img,xz

      - name: Replace DTB in image
        run: |
          set -e
          if [ -f rk3399-custom.dtb ]; then
            DTB=rk3399-custom.dtb
          elif [ -f .github/workflows/rk3399-custom.dtb ]; then
            DTB=.github/workflows/rk3399-custom.dtb
          else
            echo "!! 未找到 rk3399-custom.dtb（需上传到仓库）"
            exit 1
          fi
          echo "使用 DTB: $DTB"
          IMG=$(ls build/output/images/*.img | head -1)
          echo "镜像: $IMG"
          LOOP=$(sudo losetup -f)
          sudo losetup -P $LOOP "$IMG"
          sleep 2
          sudo mkdir -p /mnt/arm
          sudo mount ${LOOP}p1 /mnt/arm
          echo "镜像内 DTB:"
          find /mnt/arm/boot -name 'rk3399-rockpro64.dtb' -print
          sudo find /mnt/arm/boot -name 'rk3399-rockpro64.dtb' \
            -exec cp "$DTB" {} \;
          sudo umount /mnt/arm
          sudo losetup -d $LOOP
          echo "DTB 替换完成"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3399-custom
          path: |
            build/output/images/*.img*
          retention-days: 7
