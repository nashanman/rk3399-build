name: Build Armbian RK3399 custom

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Armbian 板型'
        required: true
        default: rockpro64
      branch:
        description: '内核分支 (current/edge/vendor)'
        required: true
        default: current
      release:
        description: '发行版 (trixie/noble)'
        required: true
        default: trixie

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Checkout armbian/build
        uses: actions/checkout@v5
        with:
          repository: armbian/build
          path: build

      - name: Compile Armbian
        working-directory: build
        run: |
          sudo ./compile.sh \
            BOARD=${{ inputs.board }} \
            BRANCH=${{ inputs.branch }} \
            RELEASE=${{ inputs.release }} \
            BUILD_MINIMAL=yes \
            ROOTFS_SIZE=4096 \
            KERNEL_CONFIGURE=no \
            KERNEL_BTF=no \
            COMPRESS_OUTPUTIMAGE=img,xz

      - name: Upload compiled image
        uses: actions/upload-artifact@v4
        with:
          name: armbian-compiled
          path: build/output/images/*.img.xz
          retention-days: 7
          if-no-files-found: error

  patch:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Download compiled image
        uses: actions/download-artifact@v4
        with:
          name: armbian-compiled
          path: img

      - name: Replace DTB in image
        run: |
          set -e
          if [ -f "$GITHUB_WORKSPACE/rk3399-custom.dtb" ]; then
            DTB="$GITHUB_WORKSPACE/rk3399-custom.dtb"
          elif [ -f "$GITHUB_WORKSPACE/.github/workflows/rk3399-custom.dtb" ]; then
            DTB="$GITHUB_WORKSPACE/.github/workflows/rk3399-custom.dtb"
          else
            echo "!! 未找到 rk3399-custom.dtb（需上传到仓库）"
            exit 1
          fi
          echo "使用 DTB: $DTB"

          cd "$GITHUB_WORKSPACE/img"
          XZ=$(ls *.img.xz 2>/dev/null | head -1 || true)
          if [ -z "$XZ" ]; then
            echo "!! 未找到 .img.xz:"
            ls -la
            exit 1
          fi
          echo "解压: $XZ"
          sudo xz -dk "$XZ"
          IMG=${XZ%.xz}
          echo "镜像: $IMG"

          LOOP=$(sudo losetup -f)
          sudo losetup -P "$LOOP" "$IMG"
          sleep 2
          sudo mkdir -p /mnt/arm
          sudo mount "${LOOP}p1" /mnt/arm
          echo "镜像内 DTB:"
          find /mnt/arm/boot -name 'rk3399-rockpro64.dtb' -print
          sudo find /mnt/arm/boot -name 'rk3399-rockpro64.dtb' -exec cp "$DTB" {} \;
          sudo umount /mnt/arm
          sudo losetup -d "$LOOP"

          sudo xz -f "${IMG}"
          sudo rm -f "${IMG}"
          echo "完成，产物:"
          ls -lh *.img.xz

      - name: Upload final image
        uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3399-custom
          path: img/*.img.xz
          retention-days: 7
          if-no-files-found: error
